name: PUBLISH TO NPM

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Check tag matches version
        run: |
          TAG=${GITHUB_REF_NAME#v}
          VERSION=$(node -p "require('./package.json').version")

          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match package.json version $VERSION"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check package contents
        run: |
          npm pack --dry-run --json 2>/dev/null | node -e '
            const { readFileSync } = require("node:fs");
            const [pkg] = JSON.parse(readFileSync(0, "utf8"));
            const allowed = /^(package\.json|README\.md|LICENSE|dist\/.+)$/;
            const extra = pkg.files.map((file) => file.path).filter((path) => !allowed.test(path));

            if (extra.length) {
              console.error(`::error::В пакет попали лишние файлы:%0A${extra.join("%0A")}`);
              process.exit(1);
            }

            console.log(`В пакете ${pkg.files.length} файлов, лишнего нет`);
          '

      - name: Dry run
        run: npm publish --dry-run

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
